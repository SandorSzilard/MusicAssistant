name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libasound2-dev libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev patchelf wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Release tooling tests
        run: npm run test:release-tools

      - name: Frontend unit tests
        run: npm test

      - name: Frontend coverage
        run: npm run test:coverage

      - name: TypeScript type check
        run: npm run typecheck

      - name: Angular production build
        run: npm run frontend:build

      - name: Rust tests
        run: npm run rust:test

      - name: Rust format check
        run: npm run rust:fmt

      - name: Rust check
        run: npm run rust:check

      - name: Tauri application build
        run: npm run build:app
